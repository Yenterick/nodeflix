<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Personal Reminder: Never do something in vanilla js just bc its just one page :D -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodeflix Media Processor</title>
    <link rel="shortcut icon" href="../../public/assets/icon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- Funnel Display font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header with app name and important logos -->
    <div class="header">
        <p class="title">
            Nodeflix
        </p>
        <div class="logos">
            <img 
                class="logo"
                src="../../public/assets/icon.png" 
                alt="nodeflix-logo"
            >
            <hr class="divider">
            <img 
                class="logo"
                src="../../public/assets/universidadLibre.png" 
                alt="universidadLibre-logo"
            >
        </div>
        
    </div>
    <!-- Form with all the environmental variables needed to process the media -->
    <form class="environment-form">
        <div class="form-section">
            <p class="form-title">
                Mongo Information
            </p>
            <div class="form-line">
                <div class="form-group">
                    <label 
                        for="mongoHost" 
                        name="mongoHost"
                    >
                        Host
                    </label>
                    <input 
                        type="text"
                        placeholder="Insert your Mongo host..."
                        required
                    >
                </div>
                <div class="form-group">
                    <label 
                        for="mongoPort" 
                        name="mongoPort"
                    >
                        Port
                    </label>
                    <input 
                        type="number"
                        placeholder="Insert your Mongo port..."
                        required
                    >
                </div>
            </div>            
            <div class="form-line">
                <div class="form-group">
                    <label 
                        for="mongoUsername" 
                        name="mongoUsername"
                    >
                        Username
                    </label>
                    <input 
                        type="text"
                        placeholder="Insert your Mongo username..."
                        required
                    >
                </div>
                <div class="form-group">
                    <label 
                        for="mongoPassword" 
                        name="mongoPassword"
                    >
                        Password
                    </label>
                    <input 
                        type="text"
                        placeholder="Insert your Mongo password..."
                        required
                    >
                </div>
            </div>           
            <div class="form-line">
                <div class="form-group">
                    <label 
                        for="mongoDb" 
                        name="mongoDb"
                    >
                        Database
                    </label>
                    <input 
                        type="text"
                        placeholder="Insert your Mongo database name..."
                        required
                    >
                </div>
            </div>
        </div>
        <div class="form-section">
            <p class="form-title">
                SSH Information
            </p>
            <div class="form-line">
                <div class="form-group">
                    <label 
                        for="sshHost" 
                        name="sshHost"
                    >
                        Host
                    </label>
                    <input 
                        type="text"
                        placeholder="Insert your SSH host..."
                        required
                    >
                </div>
                <div class="form-group">
                    <label 
                        for="sshPort" 
                        name="sshPort"
                    >
                        Port
                    </label>
                    <input 
                        type="number"
                        placeholder="Insert your SSH port..."
                        required
                    >
                </div>
            </div>
            <div class="form-line">
                <div class="form-group">
                    <label 
                        for="sshKeyPath" 
                        name="sshKeyPath"
                    >
                        Key Path
                    </label>
                    <input 
                        type="text"
                        placeholder="Insert your SSH key path..."
                        required
                    >
                </div>
                <div class="form-group">
                    <label 
                        for="sshPort" 
                        name="sshPort"
                    >
                        Username
                    </label>
                    <input 
                        type="text"
                        placeholder="Insert your SSH username..."
                        required
                    >
                </div>
            </div>
        </div>
        <button type="submit">
            Continue Processing...
        </button>
    </form>
</body>
</html>
